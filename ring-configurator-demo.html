<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ring Configurator Demo Store</title>
  <style>
    :root {
      --demo-bg: #f7f5f1;
      --demo-card: #ffffff;
      --demo-line: #dedbd3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--demo-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .demo-store {
      min-height: 100vh;
      padding: 0;
    }

    .demo-shell {
      width: 100%;
      margin: 0 auto;
    }

    .demo-frame-card {
      overflow: hidden;
      border: 1px solid var(--demo-line);
      border-radius: 0;
      background: var(--demo-card);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      min-height: 720px;
      border: 0;
      background: #fff;
    }

    @media (max-width: 800px) {
      iframe {
        height: 100vh;
        min-height: 640px;
      }
    }
  </style>
</head>
<body>
  <main class="demo-store">
    <div class="demo-shell">
      <section class="demo-frame-card" aria-label="Ring configurator">
        <iframe
          src="https://next-frontend-app-one.vercel.app/?theme=theme-3&flow=3B"
          title="Theme 3 Ring Configurator demo"
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </section>
    </div>
  </main>
</body>
</html>
